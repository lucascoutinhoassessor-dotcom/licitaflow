name: Deploy to Vercel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: production
            project_secret: VERCEL_PROJECT_ID_PROD
          - target: demo
            project_secret: VERCEL_PROJECT_ID_DEMO
    environment:
      name: ${{ matrix.target }}
    concurrency:
      group: vercel-${{ matrix.target }}
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in GitHub Actions secrets for this environment. Project secret: ${{ matrix.project_secret }}."
              exit 1
            fi
          done
      - name: Pull Vercel project settings
        run: npx --yes vercel@65.16.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build using the project's Vercel environment
        run: npx --yes vercel@65.16.0 build --prod --token="$VERCEL_TOKEN"
      - name: Publish production deployment
        run: npx --yes vercel@65.16.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
