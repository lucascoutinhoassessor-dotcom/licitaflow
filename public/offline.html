<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>LicitaForce · Reconectando</title>
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0f172a;color:#f8fafc;font:16px system-ui}
    main{box-sizing:border-box;width:100%;max-width:32rem;padding:2rem}
    p{color:#cbd5e1;line-height:1.6}button{border:0;padding:1rem;background:#2563eb;color:white;border-radius:.5rem;font:inherit;cursor:pointer;min-height:44px}button:disabled{opacity:.6}button:focus-visible{outline:3px solid #93c5fd;outline-offset:3px}small{display:block;margin-top:1rem;color:#cbd5e1;line-height:1.5}
  </style>
</head>
<body><main>
  <h1>Não foi possível acessar o LicitaForce</h1>
  <p>A conexão com a plataforma está indisponível. Pode ser uma interrupção da rede ou do serviço. Quando a conexão voltar, esta página tentará reabrir automaticamente.</p>
  <button id="tentar" type="button">Tentar novamente</button>
  <small id="estado" role="status" aria-live="polite">Seus dados precisam de conexão para serem consultados. Esta tela não salva alterações.</small>
</main>
<script src="/offline.js"></script>
</body>
</html>
